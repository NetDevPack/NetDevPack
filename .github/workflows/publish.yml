name: NetDevPack - MASTER Publish

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release to publish again (e.g. 9.0.0). Builds tag v<version> and pushes it to nuget.org.
        required: true

env:
  CURRENT_REPO_URL: https://github.com/${{ github.repository }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Semantic Release
        id: semantic
        if: github.event_name == 'push'
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        if: github.event_name == 'workflow_dispatch' || steps.semantic.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ inputs.version || steps.semantic.outputs.new_release_version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid version '$VERSION'"; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Package
        if: steps.version.outputs.value != ''
        run: dotnet pack src/NetDevPack/NetDevPack.csproj -c Release -o out -p:PackageVersion=${{ steps.version.outputs.value }} -p:RepositoryUrl=${{ env.CURRENT_REPO_URL }}

      - name: NuGet login (trusted publishing)
        id: nuget
        if: steps.version.outputs.value != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the package to nuget.org
        if: steps.version.outputs.value != ''
        run: dotnet nuget push ./out/*.nupkg --skip-duplicate -k ${{ steps.nuget.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
