version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      tests:
        patterns: ["xunit*", "AwesomeAssertions"]
    ignore:
      # Never reintroduce FluentAssertions (commercial license since v8)
      - dependency-name: "FluentAssertions"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
